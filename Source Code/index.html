<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Mask Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <h1>🦠 Face Mask Detection</h1>
            <p class="subtitle">AI-powered mask detection using deep learning</p>
        </header>

        <main>
            <!-- 🖼️ Upload / Camera -->
            <div class="upload-section">
                <div class="upload-box" id="uploadBox">
                    <div class="upload-content">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <h3>Upload Image</h3>
                        <p>Click to select or drag and drop</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>
                </div>

                <div class="camera-section">
                    <button id="cameraBtn" class="btn btn-camera">📷 Use Camera</button>
                    <video id="video" autoplay hidden></video>
                    <canvas id="canvas" hidden></canvas>
                </div>
            </div>

            <!-- 🧾 Image Preview -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="image-preview">
                    <img id="previewImage" alt="Preview">
                </div>
                <div class="actions">
                    <button id="analyzeBtn" class="btn btn-primary">🔍 Analyze</button>
                    <button id="resetBtn" class="btn btn-secondary">🔄 Reset</button>
                </div>
            </div>

            <!-- ⏳ Loading Spinner -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>

            <!-- ✅ Result Display (below image, no overlay) -->
            <div class="result-section" id="resultSection" style="display: none;">
                <div class="result-card" id="resultCard">
                    <h2 id="resultTitle"></h2>
                    <p class="confidence-text" id="confidenceText"></p>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by TensorFlow & MobileNetV2</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
